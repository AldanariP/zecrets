<main
        data-signals:_ciphertext="'{s}'"
        data-signals:_iv="'{s}'"
        data-signals:_delete-on-first-view="{any}"
        data-signals:_secret-id="{d}"
>
<div class="card">
    <div class="card-inner open"
         data-signals:_revealed="false"
    >
        <textarea id="secret"
                  data-class:blured="!$_revealed"
                  data-signals:_secret-txt="'Lorem ipsum dolor sit amet, consectetur porttitor.'"
                  data-text="$_secretTxt"
                  data-on:readsecret__window="$_revealed = true; $_secretTxt = evt.detail.secret"
        ></textarea>
        <button id="reveal"
                data-signals:_reveal-btn-text="'Reveal'"
                data-text="$_revealBtnText"
                data-on:click="!$_revealed ? readSecret($_ciphertext, $_iv, $_deleteOnFirstView, $_secretId) : copyLink(el, $_secretTxt)"
                data-on:readsecret__window="$_revealBtnText = evt.detail.btnText"
                data-on:copydone="$_revealBtnText = evt.detail.text"
                data-on:copydone__delay.3s="$_revealBtnText = 'Copy'"
        ></button>
    </div>
</div>
</main>
<script>{s}</script>
